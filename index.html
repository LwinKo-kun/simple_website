<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Organization Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>Organization Dashboard</h1>
  <button id="themeToggle">Toggle Theme</button>
</header>

<main>

  <!-- Search & Sort -->
  <section class="controls">
    <input type="text" id="search" placeholder="Search organizations...">

    <select id="sort">
      <option value="">Sort By</option>
      <option value="name">Name</option>
      <option value="employees">Employees</option>
      <option value="location">Location</option>
    </select>
  </section>

  <!-- Organizations -->
  <section id="content">
    <p>Loading organizations...</p>
  </section>

  <!-- Add / Edit Form -->
  <section class="add-org">
    <h2>Add Organization</h2>

    <input type="text" id="orgName" placeholder="Organization Name">
    <input type="number" id="orgFounded" placeholder="Founded Year">
    <input type="text" id="orgLocation" placeholder="Location">
    <input type="number" id="orgEmployees" placeholder="Employees">
    <textarea id="orgDesc" placeholder="Description"></textarea>

    <button id="addOrgBtn">Add Organization</button>
  </section>

  <!-- Contact -->
  <section class="contact-section">
    <h2>Contact Us</h2>

    <input type="text" id="contactName" placeholder="Your Name">
    <input type="email" id="contactEmail" placeholder="Your Email">
    <textarea id="contactMessage" placeholder="Your Message"></textarea>

    <button id="contactBtn">Send Message</button>
  </section>

  <!-- Chart -->
  <section class="chart-section">
    <h2>Employee Distribution</h2>
    <canvas id="employeeChart"></canvas>
  </section>

</main>

<footer>
  © 2026 Organization Dashboard
</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/app.js"></script>

</body>
</html>
